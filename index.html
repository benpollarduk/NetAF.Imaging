<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly.w3qd1tpl0e.js"></script>
    <script>
        window.canvasView = {
            // returns the inner (content) size of the viewport element
            getViewportSize: function (el) {
                if (!el) return { width: 0, height: 0 };
                const style = getComputedStyle(el);
                const padX = parseFloat(style.paddingLeft) + parseFloat(style.paddingRight);
                const padY = parseFloat(style.paddingTop) + parseFloat(style.paddingBottom);
                return { width: el.clientWidth - padX, height: el.clientHeight - padY };
            },
            // returns the bounding rect of the viewport element
            getRect: function (el) {
                if (!el) return { left: 0, top: 0, width: 0, height: 0 };
                const r = el.getBoundingClientRect();
                return { left: r.left, top: r.top, width: r.width, height: r.height };
            }
        };

        window.clipboard = {
            // copies the provided text to the clipboard
            copy: async function (text) {
                try {
                    await navigator.clipboard.writeText(text ?? "");
                    return true;
                } catch {
                    return false;
                }
            },
            // reads text from the clipboard
            paste: async function () {
                try {
                    return await navigator.clipboard.readText();
                } catch {
                    return "";
                }
            }
        };
    </script>
